<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <script>
    let random = Math.floor(Math.random() * 10) + 1
    let flag = true
    // 设定3次 3次没猜对直接退出游戏
    for (let i = 1; i <= 3; i++) {
      // 用户输入
      let num = +prompt('请输入一个1~10之间的数字:')
      // 判断输出
      if (num > random) {
        alert('您猜大了')
      } else if (num < random) {
        alert('您猜小了')
      } else {
        alert('您猜对了')
        flag = false
        break
      }
    }
    if (flag) {
      alert('次数已经用完了')
    }
  </script>
</body>

</html>
