<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <script>
    // 1. 求最大值函数
    function getMax(x, y) {
      return x > y ? x : y
    }
    let max = getMax(1, 2)
    console.log(max)

    // 2. 求任意数组的最大值， 并且返回
    function getArrValue(arr = []) {
      // (1)准备一个临时变量存放数组的第一个值
      let max = arr[0]
      // (2)遍历比较
      for (let i = 1; i < arr.length; i++) {
        if (arr[i] > max) {
          max = arr[i]
        }
      }
      return max
    }
    max = getArrValue([211, 985, 24])
    console.log(max)
  </script>
</body>

</html>
