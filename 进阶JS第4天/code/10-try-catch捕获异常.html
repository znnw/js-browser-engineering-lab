<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <p>123</p>
  <script>
    function fn() {
      try {
        const p = document.querySelector('.p')
        p.style.color = 'red'
      } catch (err) {
        // 拦截错误，展示浏览器提供的错误信息，但是不中断程序的指向
        console.log(err.message)
        throw new Error('选择器错误')
        // return
      } finally {
        // 不管程序对不对，一定会执行的代码
        alert('弹出对话窗')
      }
      console.log(11)
    }
    fn()
  </script>
</body>

</html>
