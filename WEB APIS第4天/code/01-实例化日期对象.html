<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <script>
    // 实例化 new
    // 1. 得到当前时间
    const date = new Date()
    console.log(date) // Tue Jul 23 2024 10:48:36 GMT+0800 (中国标准时间)
    // 2. 指定时间
    const date1 = new Date('2025-5-1')
    console.log(date1) // Thu May 01 2025 00:00:00 GMT+0800 (中国标准时间)
  </script>
</body>

</html>
