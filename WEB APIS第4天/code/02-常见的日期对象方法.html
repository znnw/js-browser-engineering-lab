<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <script>
    // 获得日期对象
    const date = new Date()
    // 使用里面的方法
    console.log(date.getFullYear())// 2024
    console.log(date.getMonth() + 1)// 7
    console.log(date.getDate())// 23
    console.log(date.getDay())// 2 //星期几
  </script>
</body>

</html>
