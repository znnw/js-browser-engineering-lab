<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <script>
    // 1. getTime()
    const date = new Date()
    console.log(date.getTime())

    // 2. +new Date()
    console.log(+new Date())

    // 3. Date.now()
    console.log(Date.now())

    console.log('----------')

    // 获取指定日期时间的时间戳
    console.log(+new Date())
    console.log(+new Date('2024-7-23 12:00:00'))
  </script>
</body>

</html>
