<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <script>
    // 1. 外层循环控制行数
    for (let i = 0; i < 5; i++) {
      // 2. 里层循环控制列数(几个星星)
      for (let j = 0; j < i + 1; j++) {
        document.write('★')
      }
      document.write('<br>')
    }
  </script>
</body>

</html>
